<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד סקר בזמן אמת</title>
  
  <!-- Chart.js להצגת הגרפים -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      width: 100%;
      max-width: 550px;
      padding: 30px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 20px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .status-bar {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 25px;
      text-align: right;
    }
    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .status-title {
      font-weight: 700;
      color: #f8fafc;
      font-size: 1.1rem;
    }
    .online-count {
      color: #22c55e;
      font-size: 1.4rem;
      font-weight: 800;
    }
    .callers-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 120px;
      overflow-y: auto;
      padding-top: 5px;
    }
    .phone-tag {
      background: #0284c7;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .total-box {
      margin-bottom: 20px;
    }
    .total-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .total-label {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    .chart-container {
      position: relative;
      margin: 0 auto 25px auto;
      width: 100%;
      max-width: 280px;
    }
    .btn-reset {
      background: #ef4444;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      font-size: 0.95rem;
    }
    .btn-reset:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>📊 דשבורד סקר בלייב</h1>

    <!-- בר מחוברים בזמן אמת -->
    <div class="status-bar">
      <div class="status-header">
        <span class="status-title">📞 מחוברים בקו כרגע:</span>
        <span class="online-count" id="onlineCount">0</span>
      </div>
      <div class="callers-tags" id="phoneList">
        <span style="color: #64748b; font-size: 0.9rem;">אין מאזינים בקו כרגע...</span>
      </div>
    </div>

    <!-- נתוני הסקר -->
    <div class="total-box">
      <div class="total-number" id="totalVotes">0</div>
      <div class="total-label">סך הכל הצבעות בסקר</div>
    </div>

    <div class="chart-container">
      <canvas id="pollChart"></canvas>
    </div>

    <button class="btn-reset" onclick="resetAllData()">🗑️ איפוס סקר ומחוברים</button>
  </div>

  <script>
    // חיבור ל-Firebase של הפרויקט שלך
    const firebaseConfig = {
      databaseURL: "https://pool-8c1b7-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let chartInstance = null;

    // 1. האזנה בזמן אמת למאזינים מחוברים בשיחה
    db.ref('online').on('value', snapshot => {
      const data = snapshot.val() || {};
      const phones = Object.keys(data);

      document.getElementById('onlineCount').innerText = phones.length;
      const phoneListDiv = document.getElementById('phoneList');

      if (phones.length > 0) {
        phoneListDiv.innerHTML = phones.map(p => `<span class="phone-tag">📱 ${p}</span>`).join('');
      } else {
        phoneListDiv.innerHTML = '<span style="color: #64748b; font-size: 0.9rem;">אין מאזינים בקו כרגע...</span>';
      }
    });

    // 2. האזנה בזמן אמת להצבעות הסקר
    db.ref('votes').on('value', snapshot => {
      const data = snapshot.val() || {};
      const votes = Object.values(data);

      document.getElementById('totalVotes').innerText = votes.length;

      const counts = {};
      votes.forEach(v => {
        const val = v.val || "ללא בחירה";
        counts[val] = (counts[val] || 0) + 1;
      });

      const labels = Object.keys(counts).map(k => `תשובה ${k}`);
      const values = Object.values(counts);

      updateChart(labels, values);
    });

    function updateChart(labels, values) {
      const ctx = document.getElementById('pollChart').getContext('2d');
      if (chartInstance) {
        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = values;
        chartInstance.update();
      } else {
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: values,
              backgroundColor: ['#38bdf8', '#4ade80', '#facc15', '#f87171', '#a78bfa'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: '#cbd5e1', font: { family: 'system-ui' } }
              }
            },
            cutout: '70%'
          }
        });
      }
    }

    // 3. איפוס כל הנתונים בלחיצה
    function resetAllData() {
      if (confirm("האם לאפס את כל הנתונים (מחוברים והצבעות)?")) {
        db.ref('votes').remove();
        db.ref('online').remove();
      }
    }
  </script>
</body>
</html>
