<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דשבורד סקר בלייב</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; width: 100%; max-width: 500px; padding: 30px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 700; color: #f1f5f9; }
    .status-bar { display: inline-flex; align-items: center; gap: 8px; background: #0f172a; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; color: #38bdf8; margin-bottom: 20px; border: 1px solid #1e293b; }
    .pulse { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .total-box { margin-bottom: 20px; }
    .total-number { font-size: 2.5rem; font-weight: 800; color: #38bdf8; }
    .total-label { font-size: 0.9rem; color: #94a3b8; }
    .chart-container { position: relative; margin: 0 auto 25px auto; width: 100%; max-width: 280px; }
    .actions { display: flex; gap: 10px; justify-content: center; }
    .btn { border: none; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; width: 100%; }
    .btn-reset { background: #ef4444; color: white; }
    .btn-reset:hover { background: #dc2626; transform: translateY(-1px); }
  </style>
</head>
<body>

  <div class="card">
    <h1>📊 תוצאות הסקר בזמן אמת</h1>
    
    <div class="status-bar">
      <span class="pulse"></span> מתעדכן בלייב (כל שנייה)
    </div>

    <div class="total-box">
      <div class="total-number" id="totalVotes">0</div>
      <div class="total-label">סך הכל מצביעים</div>
    </div>

    <div class="chart-container">
      <canvas id="pollChart"></canvas>
    </div>

    <div class="actions">
      <button class="btn btn-reset" onclick="resetData()">🗑️ איפוס סקר</button>
    </div>
  </div>

  <script>
    // ⚠️ החלף כאן בקישור ה-Web App URL שעתקת מ-Google Apps Script:
    const API_URL = "https://script.google.com/macros/s/AKfycbyntKp6AEeDrjCcqJDK0-kx3pfij4FLFPUEoPVbPzB-Ny4uwlz8cIO-Cu9_T_Yvq8c/exec";

    let chartInstance = null;

    async function fetchData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();

        // הסרת שורת הכותרות
        const rows = data.slice(1);
        document.getElementById('totalVotes').innerText = rows.length;

        // ספירת קולות לפי תשובות
        const counts = {};
        rows.forEach(r => {
          const val = r[2] || "ללא בחירה";
          counts[val] = (counts[val] || 0) + 1;
        });

        const labels = Object.keys(counts).map(k => `קבוצה/תשובה ${k}`);
        const values = Object.values(counts);

        updateChart(labels, values);
      } catch (e) {
        console.error("שגיאה בטעינת הנתונים:", e);
      }
    }

    function updateChart(labels, values) {
      const ctx = document.getElementById('pollChart').getContext('2d');

      if (chartInstance) {
        chartInstance.data.labels = labels;
        chartInstance.data.datasets[0].data = values;
        chartInstance.update('none'); // עדכון חלק ללא אנימציה מעצבנת בכל שנייה
      } else {
        chartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: values,
              backgroundColor: ['#38bdf8', '#4ade80', '#facc15', '#f87171', '#a78bfa'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                position: 'bottom',
                labels: { color: '#cbd5e1', font: { family: 'system-ui' } }
              }
            },
            cutout: '70%'
          }
        });
      }
    }

    async function resetData() {
      if (!confirm("האם אתה בטוח שברצונך לאפס את כל נתוני הסקר?")) return;

      try {
        await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "reset" })
        });
        fetchData();
      } catch (e) {
        alert("שגיאה באיפוס הסקר");
      }
    }

    // הפעלה ראשונית ורענון בלופ כל שנייה (1000ms)
    fetchData();
    setInterval(fetchData, 1000);
  </script>
</body>
</html>
